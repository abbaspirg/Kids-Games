<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>FitStreak</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="view"></main>

  <nav class="tabs">
    <button data-tab="today" class="active"><span>🏠</span>Today</button>
    <button data-tab="progress"><span>📈</span>Progress</button>
    <button data-tab="settings"><span>⚙️</span>Settings</button>
  </nav>

  <div id="player" class="overlay hidden"></div>
  <div id="celebrate" class="overlay hidden"></div>
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
