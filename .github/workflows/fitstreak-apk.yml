name: Build FitStreak APK

on:
  push:
    paths:
      - 'fitstreak/**'
      - '.github/workflows/fitstreak-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitstreak
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PversionCode=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk FitStreak.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FitStreak-apk
          path: fitstreak/FitStreak.apk

      - name: Publish as a GitHub Release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fitstreak-v1.0.${{ github.run_number }}
          name: FitStreak 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: fitstreak/FitStreak.apk
          body: |
            Download **FitStreak.apk** below on your Android phone and open it to install.
            Installing a newer version over an older one keeps your streak and history.
