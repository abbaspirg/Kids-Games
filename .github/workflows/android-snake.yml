name: Build Spooky Snake APK

on:
  push:
    paths:
      - "SnakeGame/**"
      - ".github/workflows/android-snake.yml"
  pull_request:
    paths:
      - "SnakeGame/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SnakeGame
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: spooky-snake-apk
          path: |
            SnakeGame/app/build/outputs/apk/debug/app-debug.apk
            SnakeGame/app/build/outputs/apk/release/app-release.apk
