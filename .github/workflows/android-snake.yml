name: Build Spooky Snake APK

on:
  push:
    paths:
      - "SnakeGame/**"
      - ".github/workflows/android-snake.yml"
  pull_request:
    paths:
      - "SnakeGame/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SnakeGame
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: spooky-snake-apk
          path: |
            SnakeGame/app/build/outputs/apk/debug/app-debug.apk
            SnakeGame/app/build/outputs/apk/release/app-release.apk

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SnakeGame
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          working-directory: SnakeGame
          script: ./scripts/smoke-test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-results
          path: SnakeGame/smoke/
